<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goal8</title>
    <style>
        .main{
            position: relative;
            width: 500px;
            height: 300px;
            margin-left: 200px;
            margin-top: 200px;
            background-color: blueviolet;
        }
        .circle{
            position: absolute;
            width: 200px;
            height: 200px;
            left: 250px;
            top: 150px;
            background-color:orangered ;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="circle"></div>
    </div>
</body>
</html>
